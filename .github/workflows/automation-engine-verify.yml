name: Automation Engine Verify

on:
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'
  pull_request:
    paths:
      - '.github/workflows/automation-engine-bootstrap.yml'
      - '.github/workflows/automation-engine-verify.yml'
      - 'scripts/verify_automation_engine.py'

permissions:
  contents: read

concurrency:
  group: automation-engine-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Validate automation engine invariants
        # Non-fatal: verifier may exit non-zero when engine is intentionally disabled.
        # The artifact upload captures the report regardless.
        continue-on-error: true
        run: |
          python scripts/verify_automation_engine.py \
            --repo-root . \
            --summary-file automation-engine-verify-summary.md \
            --report-file automation-engine-verify-report.json

      - name: Publish verification summary
        if: always()
        run: |
          if [[ -f automation-engine-verify-summary.md ]]; then
            cat automation-engine-verify-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Automation engine verification" >> "$GITHUB_STEP_SUMMARY"
            echo "Summary file not found; verification likely failed before writing output." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-engine-verify-${{ github.run_id }}
          path: |
            automation-engine-verify-summary.md
            automation-engine-verify-report.json
          if-no-files-found: warn
          retention-days: 14
