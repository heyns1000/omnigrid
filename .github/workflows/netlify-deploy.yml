name: Netlify Deploy - Quantum Dashboard 3.0

on:
  push:
    branches:
      - main
      - copilot/**
    paths:
      - '**.html'
      - 'public/**'
      - 'quantum-resilient-dashboard-v3.html'
      - '.github/workflows/netlify-deploy.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Netlify
    permissions:
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: fullstack-app-extracted/Hello-there-What-kind-of-software-project-are-you-looking/package-lock.json

      - name: Install Dependencies
        run: |
          npm install --production || echo "No dependencies to install"

      - name: Prepare Build Directory
        run: |
          mkdir -p build

          if [ -d "public" ]; then
            echo "Copying public directory..."
            cp -r public/* build/
          else
            echo "No public directory found"
          fi

          if ls *.html 1> /dev/null 2>&1; then
            echo "Copying root HTML files..."
            cp *.html build/
          else
            echo "No root HTML files found"
          fi

          if [ -f quantum-resilient-dashboard-v3.html ]; then
            echo "Setting up quantum dashboard as index..."
            cp quantum-resilient-dashboard-v3.html build/
            cp quantum-resilient-dashboard-v3.html build/index.html
          else
            echo "Warning: quantum-resilient-dashboard-v3.html not found!"
            exit 1
          fi

          if [ -d "public/assets" ]; then
            echo "Copying assets..."
            mkdir -p build/assets
            cp -r public/assets/* build/assets/
          fi

          echo "Build directory contents:"
          ls -la build/

      - name: Deploy to Netlify (Production)
        if: github.ref == 'refs/heads/main' && secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != ''
        # Non-fatal: an expired/misconfigured token warns rather than failing main CI.
        continue-on-error: true
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './build'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: |
            Deploy from GitHub Actions - Quantum Dashboard 3.0
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          enable-pull-request-comment: true
          enable-commit-comment: true
          enable-commit-status: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: Deploy to Netlify (Preview)
        if: github.event_name == 'pull_request' && secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != ''
        continue-on-error: true
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './build'
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: |
            Preview Deploy from PR #${{ github.event.pull_request.number }}
            Commit: ${{ github.sha }}
          enable-pull-request-comment: true
          enable-commit-comment: true
          enable-commit-status: true
          overwrites-pull-request-comment: true
          alias: pr-${{ github.event.pull_request.number }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: HotStack Sync Notification
        if: success() && secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != ''
        run: |
          echo "✅ Netlify Deployment Complete"
          echo "Build completed at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"

      - name: Skip deploy when Netlify secrets are missing
        if: secrets.NETLIFY_AUTH_TOKEN == '' || secrets.NETLIFY_SITE_ID == ''
        run: |
          echo "ℹ️ Skipping Netlify deploy: NETLIFY_AUTH_TOKEN/NETLIFY_SITE_ID are not configured."
